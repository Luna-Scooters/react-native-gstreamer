apply plugin: 'com.android.library'

def reactNativeArchitectures() {
    def value = project.getProperties().get("reactNativeArchitectures")
    return value ? value.split(",").collect { it.trim() } : ["armeabi-v7a", "arm64-v8a", "x86", "x86_64"]
}

android {
    compileSdkVersion 36

    defaultConfig {
        minSdkVersion 25
        targetSdkVersion 36
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "android.support.test.runner.AndroidJUnitRunner"

        externalNativeBuild {
            cmake {
                def gstRoot

                if (project.hasProperty('gstAndroidRoot'))
                    gstRoot = project.gstAndroidRoot

                if (gstRoot == null)
                    throw new GradleException('GSTREAMER_ROOT_ANDROID must be set, or "gstAndroidRoot" must be defined in your gradle.properties in the top level directory of the unpacked universal GStreamer Android binaries')

                def javaSrcDir = file('src/main/java').absolutePath
                def assetsDir = file('src/main/assets').absolutePath
                arguments "-DANDROID_PLATFORM=android-27", "-DGSTREAMER_JAVA_SRC_DIR=$javaSrcDir", "-DGSTREAMER_ROOT_ANDROID=$gstRoot", "-DGSTREAMER_ASSETS_DIR=$assetsDir"

                targets "rctgstplayer"

                abiFilters(*reactNativeArchitectures())
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }

    externalNativeBuild {
        cmake {
            path '../CMakeLists.txt'
        }
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation 'com.facebook.react:react-native:+'
    testImplementation 'junit:junit:4.12'
    androidTestImplementation 'com.android.support.test:runner:1.0.1'
    androidTestImplementation 'com.android.support.test.espresso:espresso-core:3.0.1'
}
